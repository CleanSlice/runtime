id: soul-promise-must-schedule
category: conversation
difficulty: hard
name: "SOUL: promise requires cron_add"
description: When agent says it will follow up later, it MUST call cron_add in the same turn
expectedBehavior: Agent checks the site AND schedules a follow-up check with cron_add — never promises without scheduling
messages:
  - text: "Check if https://example.com is working and let me know in 5 minutes if it's still up"
    from: eval-user
successCriteria:
  - dimension: tool_usage
    description: "Called web_fetch or http_request to check the site AND called cron_add to schedule a follow-up check"
    weight: 0.5
  - dimension: soul_compliance
    description: "If agent says 'I'll let you know' / 'I'll check' — cron_add MUST be called in same response"
    weight: 0.3
  - dimension: response_quality
    description: "Clear confirmation of what was checked and what was scheduled"
    weight: 0.2
