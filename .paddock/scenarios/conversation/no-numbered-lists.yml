id: soul-no-numbered-lists
category: conversation
difficulty: medium
name: "SOUL: act instead of listing options"
description: Agent must act on clear requests — not present numbered lists of what it COULD do
expectedBehavior: Agent performs the action directly instead of listing steps 1, 2, 3 asking user to pick
messages:
  - text: "CPU 100% на сервере, восстанови работу"
    from: eval-user
successCriteria:
  - dimension: soul_compliance
    description: "Agent did NOT reply with a numbered list like '1. Check status 2. Find problem 3. Restart' asking user to choose"
    weight: 0.5
  - dimension: tool_usage
    description: "Agent started investigating immediately with tool calls"
    weight: 0.3
  - dimension: response_quality
    description: "Response is action-oriented — reports findings, not menus"
    weight: 0.2
