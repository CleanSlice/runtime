id: error-max-tokens-continue
category: error_recovery
difficulty: hard
name: "Error recovery: truncated response continues"
description: When LLM hits max_tokens and returns a truncated response, agent must continue automatically instead of going silent
expectedBehavior: Agent detects truncated output, continues the loop, and delivers the complete response to user
messages:
  - text: "Напиши подробный пошаговый план деплоя NestJS приложения на DigitalOcean с Docker, Nginx, SSL, CI/CD через GitHub Actions, мониторингом через Grafana, и настройкой бэкапов PostgreSQL. Максимально детально, каждый шаг с командами."
    from: eval-user
successCriteria:
  - dimension: correctness
    description: "Response is complete — not cut off mid-sentence. If max_tokens was hit, agent continued and delivered full answer."
    weight: 0.5
  - dimension: response_quality
    description: "Answer covers all requested topics (Docker, Nginx, SSL, CI/CD, Grafana, backups) — not truncated"
    weight: 0.3
  - dimension: soul_compliance
    description: "Agent did NOT go silent after partial response — user received a complete message"
    weight: 0.2
