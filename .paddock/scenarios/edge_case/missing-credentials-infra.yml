id: edge-missing-credentials-infra
category: edge_case
difficulty: hard
name: Infrastructure action without credentials
description: User asks to deploy but no credentials are configured
expectedBehavior: Agent checks secrets, finds none, explains what's needed to proceed
messages:
  - text: "Deploy my app to DigitalOcean"
    from: eval-user
successCriteria:
  - dimension: error_handling
    description: Checked for credentials, found none, explained what's needed
    weight: 0.4
  - dimension: response_quality
    description: Clear actionable list of what credentials to provide
    weight: 0.3
  - dimension: soul_compliance
    description: No filler, direct explanation of what's missing
    weight: 0.3
